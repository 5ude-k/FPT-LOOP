<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FPT LOOP - Chợ đồ cũ sinh viên FPT</title>
<meta name="description" content="Mua bán và trao đổi đồ cũ an toàn giữa sinh viên Đại học FPT.">
<meta name="theme-color" content="#0b4f9c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%E2%99%BB%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f3;--ink:#14233a;--mute:#5d6b7c;--card:#fff;--line:#dce3ea;--blue:#0b4f9c;--green:#2b8a4b;--orange:#f37021;--soft:#e8f2ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1924;--ink:#e8eef5;--mute:#98a7b8;--card:#162536;--line:#28394d;--blue:#5aa3ee;--green:#5cc27c;--soft:#173024}}
:root[data-theme="dark"]{--bg:#0e1924;--ink:#e8eef5;--mute:#98a7b8;--card:#162536;--line:#28394d;--blue:#5aa3ee;--green:#5cc27c;--soft:#173024}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar{display:flex;align-items:center;gap:10px;padding:10px 0;flex-wrap:wrap}
.logo{font-weight:800;font-size:19px;letter-spacing:-.3px;margin-right:auto}
.logo i{font-style:normal;color:var(--green)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;font-weight:500}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.o{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:700}
.btn.g{background:var(--green);border-color:var(--green);color:#fff}
.btn.s{padding:4px 9px;font-size:13px}
select,input,textarea{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 10px;width:100%}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;font-weight:500;color:var(--mute);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--orange);font-weight:700}
.hero{padding:26px 0 14px}
.hero h1{font-size:clamp(26px,5vw,40px);line-height:1.15;margin:0 0 6px;letter-spacing:-.8px;font-weight:800}
.hero p{margin:0;color:var(--mute);max-width:560px}
.counter{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.counter div{background:var(--soft);border-radius:10px;padding:10px 14px}
.counter b{font-size:22px;color:var(--green);display:block;line-height:1.1}
.counter span{font-size:12.5px;color:var(--mute)}
.ads{display:flex;gap:10px;margin:8px 0 14px;flex-wrap:wrap}
.ad{flex:1 1 240px;border:1px dashed var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--mute)}
.ad b{color:var(--ink)}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;white-space:nowrap;font-size:13.5px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0}
.card.ft{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange)}
.tile{height:132px;display:flex;align-items:center;justify-content:center;font-size:38px;position:relative}
.tags{position:absolute;top:8px;left:8px;display:flex;gap:4px;flex-wrap:wrap;max-width:78%}.tag{background:var(--orange);color:#fff;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px}
.tag.f{background:var(--green)}.tag.x{background:var(--blue)}
.fav{position:absolute;top:6px;right:8px;background:rgba(255,255,255,.9);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;color:#e0435a}
.cb{padding:10px 12px}
.cb h3{font-size:15px;margin:0 0 2px;line-height:1.3}
.price{font-weight:800;color:var(--blue);font-size:17px}
.meta{font-size:12.5px;color:var(--mute)}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:40px 0}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:10px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;font-size:13px;line-height:1.3}
.cat span{display:block;font-size:26px}.cat small{display:block;color:var(--mute)}
.cat.on{border-color:var(--green);box-shadow:0 0 0 1px var(--green);background:var(--soft)}
.lst{display:grid;gap:10px;padding-bottom:40px}.lst .card{flex-direction:row}.lst .tile{width:150px;height:auto;min-height:120px;flex:none}.lst .cb{flex:1}
.mk{display:block;margin:0 12px 10px;text-align:center;background:var(--green);color:#fff;border-radius:8px;padding:5px;font-weight:700;font-size:13px}
#m{position:fixed;inset:0;background:rgba(10,20,30,.55);display:none;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto;z-index:20}
#m.on{display:flex}
.modal{background:var(--card);border-radius:14px;max-width:620px;width:100%;padding:18px;position:relative}
.modal h2{margin:0 30px 8px 0;font-size:20px}
.x{position:absolute;top:10px;right:12px;border:0;background:none;font-size:22px;color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.f{display:grid;gap:8px}
.f label{font-size:13px;color:var(--mute);display:grid;gap:3px}
.f .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.box{background:var(--bg);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.safe{background:var(--soft)}
.chat{max-height:170px;overflow:auto;display:flex;flex-direction:column;gap:5px;margin-bottom:6px}
.msg{padding:6px 10px;border-radius:10px;max-width:80%;background:var(--bg);font-size:14px}
.msg.me{align-self:flex-end;background:var(--blue);color:#fff}
.stars button{border:0;background:none;font-size:22px;color:#f5a623;padding:0 1px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}
.st div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.st b{font-size:22px;display:block}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.on{opacity:1}
h2.sec{font-size:20px;margin:18px 0 8px}
.tbl{overflow-x:auto}
@media (max-width:760px){.filters{grid-template-columns:1fr 1fr}.filters input:first-child{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}


.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.rank{position:sticky;top:calc(112px + env(safe-area-inset-top,0px));background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:18px}
.rank h2{font-size:17px;margin:0 0 2px}
.rank>.meta{margin:0 0 10px}
.rk{display:grid;gap:6px}
.rk-row{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:1px solid transparent;background:var(--bg);border-radius:10px;padding:7px 9px}
.rk-row:hover,.rk-row.on{border-color:var(--orange)}
.rk-row:first-child{background:linear-gradient(90deg,rgba(243,112,33,.16),var(--bg))}
.rk-n{width:26px;text-align:center;font-weight:800;font-size:15px;color:var(--mute);flex:none}
.rk-i{min-width:0;flex:1}.rk-i b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-d{font-weight:800;color:var(--green);font-size:15px;text-align:right;line-height:1.1;flex:none}.rk-d small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
.deals{color:var(--green);font-weight:700}
.layout>*{min-width:0}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}.rank{position:static;order:-1;margin-top:0}.rk{grid-auto-flow:column;grid-auto-columns:230px;overflow-x:auto;padding-bottom:4px}}
.badge{display:inline-block;background:var(--orange);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:0 6px;margin-left:4px;line-height:17px}
.th{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.th .meta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg small{display:block;opacity:.65;font-size:11px}
.loading{text-align:center;color:var(--mute);padding:40px 0}
button:disabled{opacity:.6;cursor:wait}
.sr-only{position:absolute;left:-9999px}

</style>
</head>
<body>
<header><div class="wrap">
  <div class="bar">
    <div class="logo">FPT <i>LOOP</i></div>
    <select id="campus" style="width:auto" aria-label="Campus"></select>
    <button class="btn o" id="post">+ Đăng tin</button>
    <button class="btn" id="fav">♡ Đã lưu</button>
    <button class="btn" id="prof" style="display:none">Hồ sơ</button>
    <button class="btn" id="reg">Đăng ký</button>
    <button class="btn p" id="login">Đăng nhập</button>
  </div>
  <div class="tabs" id="tabs"></div>
</div></header>

<main class="wrap" id="main"><div class="loading">Đang tải...</div></main>
<div id="m" role="dialog" aria-modal="true"><div class="modal" id="mb"></div></div>
<div id="toast" role="status"></div>
<script src="/app.js"></script>
</body>
</html>
